<!DOCTYPE html>
<html lang="en" xmlns:th="www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoStuff Web App</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>

    <script>
        var today = new Date();
        var time = ("0" + today.getHours()).slice(-2) + ":" + ("0" + today.getMinutes()).slice(-2);
        $("#greeting").text(`${time}`)
        tody = null;
        setInterval(() => {
            var today = new Date();
            var time = ("0" + today.getHours()).slice(-2) + ":" + ("0" + today.getMinutes()).slice(-2);
            $("#time").text(`${time}`)
            tody = null;
        }, 1000);
    </script>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar navbar-dark bg-dark">
        <a class="navbar-brand" href="#">DoStuff WebApp</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/planen">Planen</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/aendern">Ändern</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/kiosk">Kiosk</a>
                </li>
            </ul>
        </div>
        <span class="navbar-text" id="time"></span>
    </nav>

    <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <form action="save">
                <h1 class="display-5">Taskname</h1>
                <input type="text" maxlength="50" name="name">
                <h1 class="display-5">Datum</h1>
                <input type="datetime-local" name="date">
                <h1 class="display-5">Wiederholung</h1>
                <select name="wiederholung" id="wiederholung">
                    <option th:value="${wiederholung.id}"
                            th:each="wiederholung : ${wiederholungen}"
                            th:text="${wiederholung.name}"
                    ></option>
        </select>
                <h1 class="display-5">Zuordnung</h1>
                <select name="zuordnung" id="zuordnung">
               <option th:value="${tasker.id}"
                       th:each="tasker : ${taskers}"
                       th:text="${tasker.name}"
               ></option>

           </select>
                <br>
                <br>
                <br>
                <button type="submit" class="btn btn-primary">Speichern</button>
            </form>
        </div>
    </div>


</body>


</html>
