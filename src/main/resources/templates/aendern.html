<!DOCTYPE html>
<html lang="en" xmlns:th="www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoStuff Web App</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script>
        var today = new Date();
        var time = ("0" + today.getHours()).slice(-2) + ":" + ("0" + today.getMinutes()).slice(-2);
        $("#greeting").text(`${time}`)
        tody = null;
        setInterval(() => {
            var today = new Date();
            var time = ("0" + today.getHours()).slice(-2) + ":" + ("0" + today.getMinutes()).slice(-2);
            $("#time").text(`${time}`)
            tody = null;
        }, 1000);
    </script>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar navbar-dark bg-dark">
        <a class="navbar-brand" href="#">DoStuff WebApp</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link " href="/planen">Planen</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/aendern">Ändern</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/kiosk">Kiosk</a>
                </li>
            </ul>
        </div>
        <span class="navbar-text" id="time"></span>
    </nav>

    <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <h1 class="display-4 center">Ändern</h1>
            <p class="lead">Hier kannst du geplante Task ändern</p>
            <h1 class="display-7 center">Alle geplanten Tasks</h1>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Beschreibung:</th>
                        <th>Zu erledigen bis:</th>
                        <th>Erledigt:</th>
                        <th>Aufgabe von:</th>
                        <th>Wiederholungen:</th>
                        <th>Ändern:</th>
                        <th>Löschen:</th>
                    </tr>
                </thead>
                <th:block th:each="task : ${tasks}">
                    <tr th:style="${task.zuerledigen.before(#dates.createNow()) and !task.erledigt} ? 'color:red' : 'color:black'">
                        <td th:text="${task.beschreibung}"></td>
                        <td th:text="${#dates.format(task.zuerledigen, 'dd.MM HH:mm')}"></td>
                        <td th:text="${task.erledigt} ? 'ja' : 'nein'"></td>
                        <td th:text="${task.tasker_id.name}"></td>
                        <td th:text="${task.wiederholungen_id.name}"></td>
                        <td>

                            <button  th:attr="onclick=|editEntry('${task.id}')|" class="btn btn-warning">Ändern</button>

                        </td>
                        <td><button th:attr="onclick=|deleteEntry('${task.id}','${task.beschreibung}')|" class="btn btn-danger">Löschen</button></td>
                    </tr>
                </th:block>
            </table>

        </div>
    </div>


</body>

<script>
    function deleteEntry(id,beschreibung) {
        if(confirm("Möchtest du wirklich den Task: " + beschreibung +" löschen"))
            location.replace("/delete?id="+id)
    }
    function editEntry(id) {
        location.replace("/aendernid?id="+id)

    }
</script>


</html>
